name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  build:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone --depth 1 https://github.com/${{ github.repository_owner }}/LarcCommon.git ${{ runner.temp }}\LarcCommon
      - run: pip install -e ${{ runner.temp }}\LarcCommon
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name eLarcProfPy main.py
