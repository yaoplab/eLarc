# Pre-commit hooks pour le Design System Larc
# 
# Installation :
#   pip install pre-commit && pre-commit install
#   
# Ce fichier est la config CENTRALE — tous les projets Larc pointent
# vers lui via leur .pre-commit-config.yaml local.
#
# Voir Sous-système D2 du skill design-system-larc
#
# Règles actives :
#   D1  — setText() HTML sans color: explicite
#   J7  — M3Frame/QWidget/QFrame avec background QSS sans WA_StyledBackground
#   D3  — Couleurs hex hardcodées (#xxxxxx) dans setStyleSheet()
#   D4  — Contrastes insuffisants (text_soft + petit texte / fond surface_variant)
#   D5  — color: text_soft dans setStyleSheet() inline
#   D6  — setStyleSheet palette sans theme_changed.connect
#   D7  — Widgets manquants dans _restyle()
#   R   — Zéro hardcoding pixels (ds.space_*, ds.radius_*, s())
#   Q1+Q3 — Tables interactives sans curseur main / eventFilter (Sous-système Q)

repos:
  - repo: local
    hooks:
      - id: lint-dlinter
        name: 🎨 Linter Design System Larc (D1+J7+D3+D4+D5+D6+D7)
        description: >
          Vérifie que tout le code Larc respecte les règles du design system :
          D1=HTML color, J7=WA_StyledBackground, D3=hex hardcodés,
          D4=contraste, D5=text_soft inline, D6=theme_changed.connect,
          D7=complétude _restyle()
        entry: python D:/projets/scripts/lint_d1_color_checker.py --rule D1+J7+D3+D4+D5+D6+D7 --fix-only
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
      - id: lint-rlinter
        name: 🔬 Linter QSS Larc (R + Q1+Q3 + Q2 — baseline, zéro NOUVEAU hardcoding)
        description: >
          Vérifie le ZERO hardcoding pixels (Sous-système R) et la règle Q1+Q3
          (tables interactives sans curseur main ni eventFilter) du skill
          design-system-larc. Mode baseline (2026-09-09, ratchet comme
          lint_widget_purity/audit_design_system) : la dette pré-existante
          (29 violations connues) reste visible mais ne bloque plus — seule
          une violation absente de la baseline retourne 1.
        entry: python D:/projets/scripts/lint_qss_hardcoding.py --check-baseline
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
      - id: lint-ui-quality
        name: ✨ Finitions UI (V1-V8, baseline)
        description: Emojis au lieu d'icônes MD3, setMinimumSize hardcodé, etc. — bloque seulement le NOUVEAU
        entry: python D:/projets/scripts/lint_ui_quality.py --check-baseline
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
      - id: lint-palette-contrast
        name: 🌓 Contraste palette (D8)
        description: Contraste texte/fond WCAG des 4 thèmes
        entry: python D:/projets/scripts/lint_palette_contrast.py
        language: system
        files: larccommon/theme\.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
      - id: lint-safe-slot
        name: 🛡️ @safe_slot manquant (baseline)
        description: Slots sans @safe_slot, anti-patterns Qt — bloque seulement le NOUVEAU
        entry: python D:/projets/scripts/lint_safe_slot.py --check-baseline
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
      - id: lint-file-size
        name: 📏 Fichiers > 1000 lignes (baseline)
        description: Refactoring requis > 1000 lignes — bloque seulement le NOUVEAU
        entry: python D:/projets/scripts/lint_file_size.py --check-baseline
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
      - id: lint-widget-purity
        name: 🧩 Widgets phibuilder uniquement (W1)
        description: RE GLE ABSOLUE CLAUDE.md -- pas de PySide6.QtWidgets direct
        entry: python D:/projets/scripts/lint_widget_purity.py --check-baseline
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
      - id: audit-design-system-baseline
        name: 📐 Audit design system (baseline)
        description: Hardcodings P0/P1/P2 -- bloque seulement le NOUVEAU
        entry: python D:/projets/scripts/audit_design_system.py --check-baseline
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: false
