[project]
name = "larcsuperviseur"
version = "1.2.0"
description = "Application de supervision des présences/événements élèves"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.5",
    "psycopg2-binary>=2.9",
    "materialyoucolor>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-qt>=4",
    "ruff>=0.15",
    "black>=26",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E701", "E702", "E722", "E741", "F821", "F841"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Les tests importent "LarcSuperviseur.views..." : la racine du monorepo
# doit être dans sys.path, quelle que soit la cwd (rootdir = repo, ".." = F:\projets)
pythonpath = [".."]
markers = [
    "integration: tests that require a real PostgreSQL database",
]
