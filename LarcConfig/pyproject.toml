[project]
name = "larcconfig"
version = "0.1.0"
description = "Configuration Larc — i18n, thèmes, rôles, logs, types, lieux"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.5",
    "psycopg2-binary>=2.9",
    "materialyoucolor>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-qt>=4",
    "reportlab>=4",   # génération du guide PDF (tools/build_guide_types.py)
    "ruff>=0.15",
    "black>=26",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E701", "E702", "E741", "F841"]

[tool.black]
line-length = 160
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
